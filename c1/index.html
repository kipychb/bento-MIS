<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>C1｜KITCHEN DIVE 台灣版 - POS 與顧客管理系統</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f4f6f8; margin: 0; padding: 20px; color: #333; }
    header { background: #d32f2f; color: white; padding: 15px 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    .live-badge { background: #ffeb3b; color: #d32f2f; padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; animation: blink 1.5s infinite; }
    @keyframes blink { 50% { opacity: 0.6; } }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; color: #d32f2f; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #eee; text-align: left; }
    button { background: #d32f2f; color: white; border: none; padding: 8px 14px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    button:hover { background: #b71c1c; }
    button.secondary { background: #757575; }
    input, select, textarea { padding: 7px; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
    .status-tag { padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
  </style>
</head>
<body>

<header>
  <div>
    <h1 style="margin:0; font-size:22px;">🍱 台灣版 KITCHEN DIVE｜C1 POS 結帳與顧客管理系統</h1>
    <small>支援極致 Lean 管理：即時扣成品庫存、巨無霸便當預訂、營收拋轉 C2</small>
  </div>
  <div class="live-badge">🔴 YouTube 24H 店內實況直播中（零保全成本）</div>
</header>

<div class="grid">
  <!-- 區塊 1：POS 現場快速結帳 -->
  <div class="card">
    <h2>🛒 1. POS 現場結帳與成品庫存</h2>
    <table id="menu-table">
      <thead>
        <tr><th>品項</th><th>單價</th><th>架上庫存</th><th>購買數量</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <div style="margin-top: 15px; display: flex; justify-content: space-between; align-items: center;">
      <select id="payment-method" style="width: 150px; margin: 0;">
        <option value="現金">💵 現金付款</option>
        <option value="LINE Pay">📱 LINE Pay</option>
      </select>
      <button onclick="checkoutPOS()">⚡ 立即結帳並扣庫存</button>
    </div>
    <p id="pos-msg" style="color: green; font-weight: bold;"></p>
  </div>

  <!-- 區塊 2：顧客線上預訂（主打 1kg/3kg 巨無霸便當） -->
  <div class="card">
    <h2>📅 2. 顧客預訂系統（巨無霸便當防報廢）</h2>
    <input type="text" id="res-name" placeholder="顧客姓名（例：王同學）">
    <input type="text" id="res-phone" placeholder="聯絡電話（例：0912-345-678）">
    <input type="time" id="res-time" required>
    <div style="display: flex; gap: 10px;">
      <select id="res-item"></select>
      <input type="number" id="res-qty" value="1" min="1" style="width: 80px;">
    </div>
    <input type="text" id="res-note" placeholder="備註（例：3公斤便當飯要壓緊）">
    <button onclick="createReservation()" style="width: 100%;">➕ 建立預訂（鎖定廚房產能）</button>
  </div>

  <!-- 區塊 3：預訂取餐與取消管理 -->
  <div class="card">
    <h2>📦 3. 預訂清單管理（取餐 / 取消）</h2>
    <table id="res-table">
      <thead>
        <tr><th>單號</th><th>顧客</th><th>取餐時間</th><th>內容</th><th>金額</th><th>狀態/操作</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- 區塊 4：顧客意見回饋與營收統計 -->
  <div class="card">
    <h2>💬 4. 顧客意見回饋 & 即時營收統計</h2>
    <div style="background: #fff3e0; padding: 10px; border-radius: 6px; margin-bottom: 15px;">
      <strong>📊 拋轉 C2 累計營收：</strong> NT$ <span id="total-rev">0</span> 元 ｜ 
      <strong>累計結帳單數：</strong> <span id="total-orders">0</span> 筆
    </div>
    <input type="text" id="fb-name" placeholder="顧客暱稱（可不填）">
    <select id="fb-rating">
      <option value="5">⭐⭐⭐⭐⭐ (5星 - 份量超大超佛心)</option>
      <option value="4">⭐⭐⭐⭐ (4星 - 好吃划算)</option>
      <option value="3">⭐⭐⭐ (3星 - 普通)</option>
      <option value="2">⭐⭐ (2星 - 需改進)</option>
      <option value="1">⭐ (1星 - 差評)</option>
    </select>
    <textarea id="fb-comment" rows="2" placeholder="輸入顧客回饋（例：看 YouTube 直播發現剛炸好雞塊馬上跑來買！）"></textarea>
    <button onclick="submitFeedback()" style="width: 100%;">📨 送出回饋</button>
    <ul id="fb-list" style="margin-top: 10px; padding-left: 20px; font-size: 14px;"></ul>
  </div>
</div>

<script>
  async function loadAllData() {
    // 1. 載入菜單
    const menuRes = await fetch('/api/c1/menu');
    const menu = await menuRes.json();
    const tbody = document.querySelector('#menu-table tbody');
    const resSelect = document.querySelector('#res-item');
    tbody.innerHTML = '';
    resSelect.innerHTML = '';

    menu.forEach(item => {
      tbody.innerHTML += `
        <tr>
          <td>${item.name} ${item.is_giant ? '🔥' : ''}</td>
          <td>$${item.price}</td>
          <td><strong>${item.stock}</strong> 份</td>
          <td><input type="number" min="0" max="${item.stock}" value="0" data-id="${item.id}" class="pos-qty" style="width:60px; margin:0;"></td>
        </tr>`;
      resSelect.innerHTML += `<option value="${item.id}">${item.name} ($${item.price})</option>`;
    });

    // 2. 載入預訂清單
    const resList = await (await fetch('/api/c1/reservations')).json();
    const resTbody = document.querySelector('#res-table tbody');
    resTbody.innerHTML = '';
    resList.forEach(r => {
      const itemsText = r.items.map(i => `${i.name} x${i.qty}`).join('<br>');
      const actionBtns = r.status === '預訂中'
        ? `<button onclick="updateRes('${r.res_id}', '已取餐')">取餐</button>
           <button class="secondary" onclick="updateRes('${r.res_id}', '已取消')">取消</button>`
        : `<span class="status-tag">${r.status}</span>`;
      resTbody.innerHTML += `
        <tr>
          <td>${r.res_id}</td>
          <td>${r.customer_name}<br><small>${r.phone}</small></td>
          <td>${r.pickup_time}</td>
          <td>${itemsText}</td>
          <td>$${r.total_amount}</td>
          <td>${actionBtns}</td>
        </tr>`;
    });

    // 3. 載入回饋與營收摘要
    const summary = await (await fetch('/api/c1/export')).json();
    document.getElementById('total-rev').innerText = summary.total_revenue;
    document.getElementById('total-orders').innerText = summary.total_orders;

    const fbList = document.getElementById('fb-list');
    fbList.innerHTML = summary.feedbacks.map(f => 
      `<li><strong>${f.customer_name}</strong> (${'⭐'.repeat(f.rating)}): ${f.comment}</li>`
    ).join('');
  }

  async function checkoutPOS() {
    const inputs = document.querySelectorAll('.pos-qty');
    const items = [];
    inputs.forEach(inp => {
      const qty = parseInt(inp.value);
      if (qty > 0) items.push({ id: inp.dataset.id, qty });
    });
    if (items.length === 0) return alert('請至少選擇一項便當！');

    const payment = document.getElementById('payment-method').value;
    const res = await fetch('/api/c1/checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items, payment_method: payment })
    });
    const data = await res.json();
    if (!data.success) return alert(data.error);
    document.getElementById('pos-msg').innerText = `✅ 結帳成功！單號：${data.record.order_id}，共 $${data.record.total_amount} 元`;
    loadAllData();
  }

  async function createReservation() {
    const customer_name = document.getElementById('res-name').value;
    const phone = document.getElementById('res-phone').value;
    const pickup_time = document.getElementById('res-time').value;
    const id = document.getElementById('res-item').value;
    const qty = parseInt(document.getElementById('res-qty').value);
    const note = document.getElementById('res-note').value;
    if (!customer_name || !phone || !pickup_time) return alert('請填寫完整預訂人資訊與取餐時間！');

    const res = await fetch('/api/c1/reservations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ customer_name, phone, pickup_time, items: [{ id, qty }], note })
    });
    const data = await res.json();
    if (!data.success) return alert(data.error);
    alert(`🎉 預訂成功！單號：${data.reservation.res_id}`);
    loadAllData();
  }

  async function updateRes(resId, status) {
    const res = await fetch(`/api/c1/reservations/${resId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status })
    });
    const data = await res.json();
    if (!data.success) return alert(data.error);
    loadAllData();
  }

  async function submitFeedback() {
    const customer_name = document.getElementById('fb-name').value;
    const rating = document.getElementById('fb-rating').value;
    const comment = document.getElementById('fb-comment').value;
    if (!comment) return alert('請輸入回饋內容！');

    await fetch('/api/c1/feedbacks', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ customer_name, rating, comment })
    });
    document.getElementById('fb-comment').value = '';
    loadAllData();
  }

  loadAllData();
</script>
</body>
</html>
